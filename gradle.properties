android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
# Gradle 8.13: retry transient repository downloads, not tasks (4 attempts; 15s/30s/60s).
systemProp.org.gradle.internal.repository.max.tentatives=4
systemProp.org.gradle.internal.repository.initial.backoff=15000
