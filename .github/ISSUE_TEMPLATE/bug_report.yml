name: Bug report
description: Report clone creation, launch, or shortcut problems.
title: "[Bug] "
labels: ["bug", "needs-info"]
body:
  - type: markdown
    attributes:
      value: |
        App Clone needs root and an Xposed framework. Please reproduce the problem
        once with only App Clone enabled if you can, then fill in the fields below.
        Reports without the exact error or framework logs are usually not actionable.
        **Review logs and screenshots before attaching them; remove personal data.**

        On App Clone 1.3+, reproduce the failure and tap **Export logs** in the
        error dialog; attach the saved `appclone-diagnostics-*.txt` file. The
        manual commands below are a fallback.

  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Xaga / Redmi Note 11T Pro
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: Android version and ROM build
      description: Settings → About phone → Android version and build number.
      placeholder: Android 15 / HyperOS 2.0.1.0.VLOINXM
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: App Clone version
      description: Shown in the LSPosed/Vector module list.
      placeholder: 1.3 (versionCode 4)
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Xposed framework
      options:
        - LSPosed
        - Vector
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: root
    attributes:
      label: Root manager and version
      placeholder: KernelSU 1.0.0 / Magisk 29
    validations:
      required: false

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: App Clone is enabled and its scope includes `system`.
          required: true
        - label: I rebooted after enabling the module.
          required: true
        - label: I tested with only App Clone enabled (other Xposed modules disabled).
          required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open App Clone.
        2. Tap + New profile.
        3. ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Expected and actual result
      description: Include the exact error text and a screenshot if possible.
    validations:
      required: true

  - type: input
    id: other
    attributes:
      label: Other modules or clone apps
      description: List other Xposed modules, especially clone/profile tools.
      placeholder: AlwaysCreateUser, Island, Shelter, ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: LSPosed / Vector logs
      description: |
        Open the framework's log viewer, reproduce the problem, then paste or
        attach the lines containing `AppClone:`. The important line is
        `AppClone: hooks installed: X/5`; fewer than 5 means a hook failed.
      render: text
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: User and clone diagnostics
      description: |
        Run these in a root terminal (Termux with `su`, or adb) and paste the
        output. The `pm create-user` command is the most useful: if it prints an
        error, that is the reason the app's creation failed.

        ```sh
        su -c 'dumpsys user'
        su -c 'pm list users'
        su -c 'pm create-user --profileOf 0 --user-type android.os.usertype.profile.CLONE TestClone'
        ```

        If the last command creates a user, remove it with
        `su -c 'pm remove-user <id>'`.
      render: text
    validations:
      required: false

  - type: textarea
    id: logcat
    attributes:
      label: Filtered logcat (optional)
      description: |
        If you have adb:

        ```sh
        adb logcat -c
        # reproduce the failure
        adb logcat -d -v threadtime > appclone-log.txt
        ```

        Attach the file or paste lines containing `AppClone`, `UserManager`,
        `UserController`, or `AndroidRuntime`.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I reviewed the logs and screenshots and removed personal data.
          required: true
